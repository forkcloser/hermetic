# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser — https://goreleaser.com — release automation for hermetic,
# the toolset's own aqua (docs/design.md). limen-install fetches the binary
# from this release under a checksum pinned in its script.
# Local dry-run: `just do release --local --dry-run` (no tag, no publish,
# artifacts under .build/). Real release: `just do release vX.Y.Z`.
version: 2

project_name: hermetic

# Everything lands under .build/release/ — covered by the canonical .gitignore;
# goreleaser's default dist/ is not. A subdirectory of .build/, not .build/
# itself: goreleaser --clean wipes its dist directory.
dist: .build/release

# Twin of the `release` recipe in .limen/just/build-go.just, the developer-facing
# builder: the intended differences are the version stamp source ({{ .Version }}
# here, `git describe` there), mod_timestamp, and the target matrix (releases
# cross-compile, dev builds are native).
builds:
  - main: ./cmd/hermetic
    binary: hermetic
    # CGO off, categorically: it is what makes the whole target matrix
    # buildable from one machine.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    buildmode: pie
    # No-ops under CGO_ENABLED=0 (pure Go already) — stated for parity with
    # the just builder, where they keep DNS and user lookups out of libc.
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Exactly the platforms .hermetic/hermetic.yaml lists under checksum.supported_envs.
    targets:
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
    # Reproducible builds: stamp the commit time, not the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

# One archive per platform, named after the binary it carries, not the
# repository: hermetic_<version>_<os>_<arch>.tar.gz is what the
# installer scripts and the setup action fetch.
archives:
  - formats: ["tar.gz"]
    name_template: "hermetic_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  # The single checksums file the installer verifies the archive against.
  name_template: checksums.txt

# An SBOM per archive, SPDX JSON by syft from the toolset, listed in
# checksums.txt and attested like the archives (book/releasing.md, "The signing
# and provenance policy"). goreleaser runs the command with a stripped
# environment (HOME, USER, TMPDIR, PATH and kin), so the two hermetic variables
# are carried through by hand: without them the syft link resolves against
# hermetic's default root, which is this root on Linux by coincidence only;
# an empty value reads as unset.
sboms:
  - artifacts: archive
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - HERMETIC_ROOT_DIR={{ envOrDefault "HERMETIC_ROOT_DIR" "" }}
      - HERMETIC_CONFIG={{ envOrDefault "HERMETIC_CONFIG" "" }}

# cosign (v3, Sigstore bundle format) over the checksums file — signing that
# one file transitively covers every artifact it lists. Keyless, in CI only
# (the release workflow runs `just do release --ci`): no key exists anywhere.
# cosign exchanges the workflow's OIDC token (id-token: write) for a
# short-lived Fulcio certificate whose identity IS the workflow@tag, and the
# signature is logged in Rekor. Verify against that identity:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       'https://github.com/forkcloser/hermetic/\.github/workflows/release\.yaml@refs/tags/v.*' \
#     checksums.txt
# The release workflow then attests every archive, SBOM and checksums.txt
# (GitHub build provenance), checked without cosign:
#   gh attestation verify <asset> --repo forkcloser/hermetic
# A local run is `--local --dry-run`, which skips signing: there is no
# key-based lane (book/releasing.md).
signs:
  - cmd: just
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - do
      - release-sign
      - "${artifact}"
      - "${signature}"

release:
  # Any prerelease-suffixed tag is published as a GitHub prerelease, so it can
  # never become the repository's "latest release", which the nightly job
  # resolves.
  prerelease: auto
  # A retried release overwrites what a partial attempt already uploaded: the
  # release recipe only reuses a tag that still points at HEAD.
  replace_existing_artifacts: true

changelog:
  use: github-native
